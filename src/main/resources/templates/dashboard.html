<!doctype html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">

<head>
    <title>Dashboard | Survey Panel</title>
    <th:block th:replace="~{fragments/layout :: adminHead}"></th:block>
    <style>
        .date-filter-container {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-left: 15px;
            padding: 5px;
            background-color: #f8f9fa;
            border-radius: 4px;
        }
        .date-filter-container label {
            margin: 0;
            font-size: 13px;
            font-weight: 500;
            white-space: nowrap;
        }
        .date-filter-container input[type="date"] {
            padding: 4px 8px;
            font-size: 13px;
            border: 1px solid #ced4da;
            border-radius: 4px;
            width: 150px;
        }
        .dropdown-item:hover {
            background-color: #556ee6;
            color: white;
        }
        .dropdown-item.active {
            background-color: #556ee6;
            color: white;
        }
        .custom-dropdown ul {
            padding: 6px 0;
            border-radius: 8px;
            overflow: hidden;
        }
        .custom-dropdown .dropdown-item {
            padding: 10px 14px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .custom-dropdown .dropdown-item:hover {
            background-color: #556ee6;
            color: #fff;
        }
        .custom-dropdown .dropdown-item:active {
            background-color: #4458c9;
        }
        #statusDropdownBtn {
            display: flex;
            align-items: center;
            gap: 6px;
        }
    </style>
</head>

<body>
<div id="layout-wrapper">

    <header id="page-topbar" th:replace="~{fragments/layout :: adminHeader}"></header>

    <div class="vertical-menu" th:replace="~{fragments/layout :: adminSidebar}"></div>

    <div class="main-content">
        <div class="page-content">
            <div class="container-fluid">
                <div class="row">
                    <div class="col-12">
                        <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                            <h4 class="mb-sm-0 font-size-18">Dashboard</h4>
                            <div class="page-title-right">
                                <ol class="breadcrumb m-0">
                                    <li class="breadcrumb-item"><a href="javascript: void(0);">Admin</a></li>
                                    <li class="breadcrumb-item active">Dashboard</li>
                                </ol>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="container-fluid">
                <div class="row">
                    <div class="col-md-12">

                        <!-- Filter Bar -->
                        <div class="row mb-3">
                            <div class="col-md-12 d-flex flex-wrap align-items-center gap-2">

                                <button id="exportExcelBtn" class="btn btn-success btn-sm">
                                    Export Excel
                                </button>

                                <div class="custom-dropdown position-relative">
                                    <button type="button" class="btn btn-primary btn-sm" id="statusDropdownBtn">
                                        <span id="filterLabel">Filter by Status: ALL</span> ▼
                                    </button>
                                    <ul id="statusDropdownMenu"
                                        style="display:none; position:absolute; z-index:1000; background:#fff;
                                               border:1px solid #ddd; list-style:none; padding:0; margin-top:5px;
                                               min-width:200px; border-radius:4px; box-shadow:0 2px 8px rgba(0,0,0,.15);">
                                        <li><a href="#" class="status-filter-option dropdown-item" data-status="">ALL</a></li>
                                        <li><a href="#" class="status-filter-option dropdown-item" data-status="COMPLETE">COMPLETE</a></li>
                                        <li><a href="#" class="status-filter-option dropdown-item" data-status="TERMINATE">TERMINATE</a></li>
                                        <li><a href="#" class="status-filter-option dropdown-item" data-status="QUOTAFULL">QUOTAFULL</a></li>
                                        <li><a href="#" class="status-filter-option dropdown-item" data-status="SECURITYTERMINATE">SECURITYTERMINATE</a></li>
                                    </ul>
                                </div>

                                <div class="d-flex align-items-center gap-1">
                                    <label class="mb-0">From</label>
                                    <input type="date" id="startDateFilter" class="form-control form-control-sm">
                                    <label class="mb-0">To</label>
                                    <input type="date" id="endDateFilter" class="form-control form-control-sm">
                                    <button id="clearDateFilter" class="btn btn-secondary btn-sm">Clear</button>
                                </div>

                                <div class="d-flex align-items-center gap-1">
                                    <input type="text" id="searchInput" class="form-control form-control-sm"
                                           placeholder="Search table..." style="width: 250px;">
                                    <button id="clearSearchBtn" class="btn btn-secondary btn-sm">Clear</button>
                                </div>

                            </div>
                        </div>

                        <table id="example" class="table table-striped table-bordered" style="width:100%">
                            <thead>
                                <tr>
                                    <th>S.No</th>
                                    <th>Project ID</th>
                                    <th>User ID</th>
                                    <th>Status</th>
                                    <th>Start</th>
                                    <th>End</th>
                                    <th>IP Address</th>
                                    <th>Country</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>

                    </div>
                </div>
            </div>
        </div>

        <footer class="footer" th:replace="~{fragments/layout :: adminFooter}"></footer>
    </div>

    <!-- Project Links Modal -->
    <div class="modal fade" id="linksModal" tabindex="-1" aria-labelledby="linksModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="linksModalLabel">Project Links</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <h6>Original Link:</h6>
                    <p><a href="#" id="originalLink" target="_blank">Click Here</a></p>
                    <h6>Countries by Links:</h6>
                    <ul id="countryList"></ul>
                </div>
            </div>
        </div>
    </div>

</div>

<th:block th:replace="~{fragments/layout :: adminScripts}"></th:block>
<th:block th:replace="~{fragments/layout :: dataTableScripts}"></th:block>

<script>var allText = /*[[${'All'}]]*/ 'All';</script>
<script src="/assets/js/pages/dashboard.js"></script>

</body>
</html>
