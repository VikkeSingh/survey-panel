<!doctype html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">

<head>
    <title>Client Details | Survey Panel</title>
    <th:block th:replace="~{fragments/layout :: adminHead}"></th:block>
</head>

<body>
<div id="layout-wrapper">

    <header id="page-topbar" th:replace="~{fragments/layout :: adminHeader}"></header>

    <div class="vertical-menu" th:replace="~{fragments/layout :: adminSidebar}"></div>

    <div class="main-content">
        <div class="page-content">
            <div class="container-fluid">
                <div class="row">
                    <div class="col-12">
                        <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                            <h4 class="mb-sm-0 font-size-18">Client Details</h4>
                            <div class="page-title-right">
                                <ol class="breadcrumb m-0">
                                    <li class="breadcrumb-item"><a href="javascript: void(0);">Admin</a></li>
                                    <li class="breadcrumb-item active">Client Details</li>
                                </ol>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="container-fluid">
                <div class="row">
                    <div class="col-lg-12">
                        <div class="card">
                            <div class="card-body">
                                <form id="addForm">
                                    <div class="row">

                                        <div class="col-lg-4 mb-3">
                                            <label for="username" class="form-label">User Name</label>
                                            <input type="text" class="form-control" id="username" name="username"
                                                   th:value="${username}" required>
                                        </div>

                                        <div class="col-lg-4 mb-3">
                                            <label for="email" class="form-label">Email</label>
                                            <input type="email" class="form-control" id="email" name="email"
                                                   th:value="${email}" required>
                                        </div>

                                        <div class="col-lg-4 mb-3">
                                            <label for="company" class="form-label">Company</label>
                                            <input type="text" class="form-control" id="company" name="company"
                                                   th:value="${company}" required>
                                        </div>

                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-12">
                        <table id="example" class="table table-striped table-bordered" style="width:100%">
                            <thead>
                                <tr>
                                    <th>Project</th>
                                    <th>Completed</th>
                                    <th>Terminated</th>
                                    <th>Quota</th>
                                    <th>Security Terminate</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <footer class="footer" th:replace="~{fragments/layout :: adminFooter}"></footer>
    </div>

    <div class="modal fade" id="linksModal" tabindex="-1" aria-labelledby="linksModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="linksModalLabel">Project Links</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <h6>Original Link:</h6>
                    <p><a href="#" id="originalLink" target="_blank">Click Here</a></p>
                    <h6>Countries by Links:</h6>
                    <ul id="countryList"></ul>
                </div>
            </div>
        </div>
    </div>

</div>

<th:block th:replace="~{fragments/layout :: adminScripts}"></th:block>
<th:block th:replace="~{fragments/layout :: dataTableScripts}"></th:block>
<script src="/assets/js/pages/view-client-info.js"></script>

</body>
</html>
