<!doctype html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">

<head>
    <title>Create Project | Survey Panel</title>
    <th:block th:replace="~{fragments/layout :: adminHead}"></th:block>
</head>

<body>
<div id="layout-wrapper">

    <header id="page-topbar" th:replace="~{fragments/layout :: adminHeader}"></header>

    <div class="vertical-menu" th:replace="~{fragments/layout :: adminSidebar}"></div>

    <div class="main-content">
        <div class="page-content">
            <div class="container-fluid">
                <div class="row">
                    <div class="col-12">
                        <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                            <h4 class="mb-sm-0 font-size-18">Create Projects</h4>
                            <div class="page-title-right">
                                <ol class="breadcrumb m-0">
                                    <li class="breadcrumb-item"><a href="javascript: void(0);">Admin</a></li>
                                    <li class="breadcrumb-item active">Projects</li>
                                </ol>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="container-fluid">
                <div class="row">
                    <div class="col-lg-12">
                        <div class="card">
                            <div class="card-body">
                                <form id="addForm">
                                    <div class="row">

                                        <div class="col-lg-4 mb-3">
                                            <label for="pid" class="form-label">Project Id</label>
                                            <input type="text" class="form-control" id="pid" name="pid" required>
                                        </div>

                                        <div class="col-lg-4 mb-3">
                                            <label for="client" class="form-label">Client</label>
                                            <select class="form-control" id="client" name="client" required>
                                                <option value="">Select a Client</option>
                                            </select>
                                        </div>

                                        <div class="col-lg-4 mb-3">
                                            <label for="ir" class="form-label">IR (Incidence Rate)</label>
                                            <input type="text" class="form-control" id="ir" name="ir" placeholder="e.g., 75" required>
                                        </div>

                                        <div class="col-lg-4 mb-3">
                                            <label for="loi" class="form-label">LOI (Length of Interview)</label>
                                            <input type="text" class="form-control" id="loi" name="loi" placeholder="e.g., 15 mins" required>
                                        </div>

                                        <div class="col-lg-12 mb-3">
                                            <label for="quota" class="form-label">Quota</label>
                                            <textarea class="form-control" id="quota" name="quota" rows="6"
                                                      placeholder="Enter quota details (supports multiple lines, special characters, etc.)" required></textarea>
                                            <small class="form-text text-muted">You can paste multi-line text with special characters here.</small>
                                        </div>

                                        <div class="col-lg-4 mb-3">
                                            <label for="counts" class="form-label">Counts</label>
                                            <input type="text" class="form-control" id="counts" name="counts" placeholder="e.g., 100" required>
                                        </div>

                                        <div class="col-lg-4 mb-3">
                                            <label for="cpi" class="form-label">CPI</label>
                                            <input type="text" class="form-control" id="cpi" name="cpi" placeholder="e.g., 5" required>
                                        </div>

                                        <div class="col-lg-4 mb-3">
                                            <label for="securityTerminate" class="form-label">Security Terminate</label>
                                            <div class="form-check form-switch">
                                                <input class="form-check-input" type="checkbox" id="securityTerminate"
                                                       name="securityTerminate" role="switch">
                                                <label class="form-check-label" for="securityTerminate">
                                                    <span id="securityTerminateStatus">Off</span>
                                                </label>
                                            </div>
                                        </div>

                                        <div id="dynamicFields">
                                            <div class="row fieldGroup">
                                                <div class="col-lg-3 mb-3">
                                                    <label class="form-label">Country Name</label>
                                                    <select name="country[]" class="form-select" required>
                                                        <option value="">-- Select Country --</option>
                                                        <th:block th:each="country : ${countries}">
                                                            <option th:value="${country.code}" th:text="${country.name}"></option>
                                                        </th:block>
                                                    </select>
                                                </div>
                                                <div class="col-lg-4 mb-3">
                                                    <label class="form-label">Links</label>
                                                    <input type="text" class="form-control" name="links[]" required>
                                                </div>
                                                <div class="col-lg-2 mb-3 d-flex align-items-end">
                                                    <button type="button" class="btn btn-success add">Add</button>
                                                </div>
                                            </div>
                                        </div>

                                        <button type="submit" id="submitForm" class="btn btn-primary mt-4">Submit</button>
                                        <div id="loader" class="text-center mt-3" style="display:none;">
                                            <div class="spinner-border text-primary" role="status"></div>
                                        </div>

                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <template id="countryOptionsTemplate">
            <option value="" selected disabled>-- Select Country --</option>
            <th:block th:each="country : ${countries}">
                <option th:value="${country.code}" th:text="${country.name}"></option>
            </th:block>
        </template>

        <footer class="footer" th:replace="~{fragments/layout :: adminFooter}"></footer>
    </div>

</div>

<th:block th:replace="~{fragments/layout :: adminScripts}"></th:block>
<th:block th:replace="~{fragments/layout :: dataTableScripts}"></th:block>
<script src="/assets/js/pages/create-projects.js"></script>

</body>
</html>
