<!doctype html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">

<head>
    <title>Assign Projects | Survey Panel</title>
    <th:block th:replace="~{fragments/layout :: adminHead}"></th:block>
    <link href="https://cdn.jsdelivr.net/npm/select2@4.0.13/dist/css/select2.min.css" rel="stylesheet"/>
</head>

<body>
<div id="layout-wrapper">

    <header id="page-topbar" th:replace="~{fragments/layout :: adminHeader}"></header>

    <div class="vertical-menu" th:replace="~{fragments/layout :: adminSidebar}"></div>

    <div class="main-content">
        <div class="page-content">
            <div class="container-fluid">
                <div class="row">
                    <div class="col-12">
                        <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                            <h4 class="mb-sm-0 font-size-18">Assign Projects</h4>
                            <div class="page-title-right">
                                <ol class="breadcrumb m-0">
                                    <li class="breadcrumb-item"><a href="javascript: void(0);">Admin</a></li>
                                    <li class="breadcrumb-item active">Projects</li>
                                </ol>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="container-fluid">
                <div class="row">
                    <div class="col-lg-12">
                        <div class="card">
                            <div class="card-body">
                                <form id="addForm">
                                    <div class="row">

                                        <div class="col-lg-6 mb-3">
                                            <label for="projects" class="form-label">Select Projects</label>
                                            <select class="form-control select2" id="projects" name="projects[]" multiple>
                                                <option value="PJ001">Project 1</option>
                                                <option value="PJ002">Project 2</option>
                                                <option value="PJ003">Project 3</option>
                                                <option value="PJ004">Project 4</option>
                                            </select>
                                        </div>

                                        <div class="col-lg-6 mb-3">
                                            <label for="vendors" class="form-label">Select Vendor</label>
                                            <select class="form-control select2" id="vendors" name="vendors[]" multiple>
                                                <option value="">-- Select Vendor --</option>
                                                <option value="V001">Vendor 1</option>
                                                <option value="V002">Vendor 2</option>
                                                <option value="V003">Vendor 3</option>
                                            </select>
                                        </div>

                                        <button type="submit" id="submitForm" class="btn btn-primary mt-4">Submit</button>
                                        <div id="loader" class="text-center mt-3" style="display:none;">
                                            <div class="spinner-border text-primary" role="status"></div>
                                        </div>

                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <footer class="footer" th:replace="~{fragments/layout :: adminFooter}"></footer>
    </div>

</div>

<th:block th:replace="~{fragments/layout :: adminScripts}"></th:block>
<th:block th:replace="~{fragments/layout :: dataTableScripts}"></th:block>
<script src="https://cdn.jsdelivr.net/npm/select2@4.0.13/dist/js/select2.min.js"></script>
<script>var allText = /*[[${'All'}]]*/ 'All';</script>
<script src="/assets/js/pages/assign-projects.js"></script>

</body>
</html>
