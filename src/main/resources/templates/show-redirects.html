<!doctype html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">

<head>
    <title>Redirects | Survey Panel</title>
    <th:block th:replace="~{fragments/layout :: adminHead}"></th:block>
</head>

<body>
<div id="layout-wrapper">

    <header id="page-topbar" th:replace="~{fragments/layout :: adminHeader}"></header>

    <div class="vertical-menu" th:replace="~{fragments/layout :: adminSidebar}"></div>

    <div class="main-content">
        <div class="page-content">
            <div class="container-fluid">
                <div class="row">
                    <div class="col-12">
                        <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                            <h4 class="mb-sm-0 font-size-18">Redirects</h4>
                            <div class="page-title-right">
                                <ol class="breadcrumb m-0">
                                    <li class="breadcrumb-item"><a href="javascript: void(0);">Admin</a></li>
                                    <li class="breadcrumb-item active">Redirects</li>
                                </ol>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="container-fluid">
                <div class="row">
                    <div class="col-md-12">
                        <table id="example" class="table table-striped table-bordered" style="width:100%">
                            <thead>
                                <tr>
                                    <th>Complete</th>
                                    <th>Terminate</th>
                                    <th>Quota Full</th>
                                    <th>Security Terminate</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                        <button class="btn btn-primary mt-2" onclick="copyToClipboard()">Copy All</button>
                    </div>
                </div>
            </div>
        </div>

        <footer class="footer" th:replace="~{fragments/layout :: adminFooter}"></footer>
    </div>

    <div class="modal fade" id="linksModal" tabindex="-1" aria-labelledby="linksModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="linksModalLabel">Project Links</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <h6>Original Link:</h6>
                    <p><a href="#" id="originalLink" target="_blank">Click Here</a></p>
                    <h6>Countries by Links:</h6>
                    <ul id="countryList"></ul>
                </div>
            </div>
        </div>
    </div>

</div>

<th:block th:replace="~{fragments/layout :: adminScripts}"></th:block>
<th:block th:replace="~{fragments/layout :: dataTableScripts}"></th:block>

<script src="/assets/js/request-handler.js"></script>
<script>var allText = /*[[${'All'}]]*/ 'All';</script>
<script src="/assets/js/pages/show-redirects.js"></script>

</body>
</html>
