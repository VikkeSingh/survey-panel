<!doctype html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">

<head>
    <title>Create Client | Survey Panel</title>
    <th:block th:replace="~{fragments/layout :: adminHead}"></th:block>
</head>

<body>
<div id="layout-wrapper">

    <header id="page-topbar" th:replace="~{fragments/layout :: adminHeader}"></header>

    <div class="vertical-menu" th:replace="~{fragments/layout :: adminSidebar}"></div>

    <div class="main-content">
        <div class="page-content">
            <div class="container-fluid">
                <div class="row">
                    <div class="col-12">
                        <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                            <h4 class="mb-sm-0 font-size-18">Create Client</h4>
                            <div class="page-title-right">
                                <ol class="breadcrumb m-0">
                                    <li class="breadcrumb-item"><a href="javascript: void(0);">Admin</a></li>
                                    <li class="breadcrumb-item active">Client</li>
                                </ol>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="container-fluid">
                <div class="row">
                    <div class="col-lg-12">
                        <div class="card">
                            <div class="card-body">
                                <form id="addForm">
                                    <div class="row">

                                        <div class="col-lg-4 mb-3">
                                            <label for="username" class="form-label">User Name</label>
                                            <input type="text" class="form-control" id="username" name="username" required>
                                        </div>

                                        <div class="col-lg-4 mb-3">
                                            <label for="details" class="form-label">Details</label>
                                            <input type="text" class="form-control" id="details" name="details">
                                        </div>

                                        <div class="col-lg-4 mb-3">
                                            <label for="company" class="form-label">Company</label>
                                            <input type="text" class="form-control" id="company" name="company" required>
                                        </div>

                                        <button type="submit" id="submitForm" class="btn btn-primary mt-4">Submit</button>
                                        <div id="loader" class="text-center mt-3" style="display:none;">
                                            <div class="spinner-border text-primary" role="status"></div>
                                        </div>

                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <footer class="footer" th:replace="~{fragments/layout :: adminFooter}"></footer>
    </div>

</div>

<th:block th:replace="~{fragments/layout :: adminScripts}"></th:block>
<th:block th:replace="~{fragments/layout :: dataTableScripts}"></th:block>
<script src="/assets/js/pages/create-client.js"></script>

</body>
</html>
